name: Validate Renovate presets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate shared preset
        run: npx --yes --package renovate@44.200.0 -- renovate-config-validator --no-global --strict default.json
